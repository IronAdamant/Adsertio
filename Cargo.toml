# Project name. This is the rename point for the crate, the `adsertio` CLI and
# the `adsertio-mcp` server binary. `publish` stays false so this crate is not
# sent to crates.io.
[package]
name = "adsertio"
version = "1.4.0"
edition = "2021"
rust-version = "1.83"
license = "MIT"
publish = false
description = "One verified-or-unverified view per claim, read from the evidence other tools left on disk. std only."
readme = "README.md"
autobins = false

[dependencies]

[dev-dependencies]

[[bin]]
name = "adsertio"
path = "src/main.rs"

[[bin]]
name = "adsertio-mcp"
path = "src/bin/adsertio-mcp.rs"
